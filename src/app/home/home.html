<section>
  <form (submit)="$event.preventDefault(); filterResults(filter.value)">
    <input type="text" placeholder="Filter by city" #filter (input)="filterResults(filter.value)"/>
    <button class="primary" type="submit">Search</button>
  </form>
</section>
<section class="results">
  @for (housingLocation of filteredHousingLocations; track $index) {
  <app-housing-location [housingLocation]="housingLocation" />
  }
</section>
